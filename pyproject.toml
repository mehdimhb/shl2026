[project]
name = "har"
version = "0.1.0"
description = "Multi-model feature fusion for sensor-based locomotion recognition on the SHL Challenge 2026 dataset"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "lightning>=2.6.1",
    "lmdb>=1.7.5",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "opencv-python>=4.13.0.92",
    "pandas>=2.0",
    "pillow>=12.1.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "timm>=1.0.24",
    "torch>=2.11.0",
    "torchaudio>=2.9.1",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "ruff>=0.15.2",
    "ty>=0.0.17",
    "fastai>=2.8.7",
    "mantis-tsfm>=1.0.0",
    "gdown>=6.1.0",
]
